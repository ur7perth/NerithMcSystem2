koth:
  default-time: "1h"
  capture-seconds: 60
  # true = players can only capture after the timer reached 0 (Active)
  capture-only-when-active: true
  # Active KOTH with nobody inside for this many seconds goes back to the timer (0 = disabled)
  idle-reset-seconds: 90
  # %player% is replaced with the winner name (runs from console)
  reward-command: "crates givekey Koth %player%"
  active-text: "&aActive"
  not-set-text: "&7Not Set"
  actionbar: "&8&lKoth &f» &7التكمله &f%seconds%&7/&f%max%"

gate:
  default-time: "30m"
  # seconds before door blocks come back after they break
  close-delay-seconds: 6
  open-text: "&aOpen"
  not-set-text: "&7Not Set"
  max-blocks: 10000

kill-messages:
  enabled: true
  fists-name: "Fists"
  # Variables: %killer% %victim% %item%
  player:
    - "&c%victim% &7was slain by &c%killer% &7using &c%item%"
    - "&7%killer% &cdestroyed &7%victim% &cwith &7%item%"
    - "&c%killer% &7took down &c%victim% &7with &c%item%"
  other: "&c%victim% &7died."

item-despawn:
  enabled: true
  seconds: 90
